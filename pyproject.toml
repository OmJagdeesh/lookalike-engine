[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lookalike-engine"
version = "0.1.0"
description = "B2B lookalike lead scoring engine for Indian SMBs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.1.18",
    "sqlalchemy>=2.0.29",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "streamlit>=1.35.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["db*", "ingest*", "enrich*", "profile*", "score*", "feedback*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
